
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Frontend Management App</title>

  <!-- React + Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #f8fafc, #eef2f7);
    }

    header {
      background: linear-gradient(90deg, #1e293b, #334155);
      color: white;
      padding: 1rem 1.5rem;
    }

    nav button {
      background: #475569;
      color: #e5e7eb;
      border: none;
      margin-right: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    nav button:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }

    .card {
      background: white;
      padding: 1.8rem;
      margin: 2rem auto;
      max-width: 1000px;
      border-radius: 14px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.08);
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Dashboard */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1.2rem;
      margin-top: 1.5rem;
    }

    .stat {
      background: linear-gradient(135deg, #e0f2fe, #f8fafc);
      padding: 1.2rem;
      border-radius: 10px;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .stat:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.12);
    }

    /* Users Page */
    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    input, select {
      padding: 0.55rem;
      border-radius: 6px;
      border: 1px solid #cbd5f5;
    }

    button[type="submit"] {
      background: linear-gradient(90deg, #16a34a, #22c55e);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    button[type="submit"]:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 15px rgba(34,197,94,0.4);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th {
      background: #f1f5f9;
      text-align: left;
      padding: 0.7rem;
    }

    td {
      padding: 0.7rem;
      border-bottom: 1px solid #e5e7eb;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge.admin {
      background: #fee2e2;
      color: #991b1b;
    }

    .badge.user {
      background: #e0f2fe;
      color: #075985;
    }

    /* Settings */
    ul {
      list-style: none;
      padding-left: 0;
      margin-top: 1rem;
    }

    li {
      background: #f8fafc;
      margin-bottom: 0.6rem;
      padding: 0.6rem;
      border-radius: 6px;
      transition: background 0.2s ease;
    }

    li:hover {
      background: #e0f2fe;
    }

    footer {
      text-align: center;
      padding: 0.75rem;
      font-size: 0.85rem;
      color: #475569;
    }

.app-subtitle {
  font-size: 0.85rem;
  opacity: 0.85;
  display: block;
  padding: 9px;
}

  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
  const API_URL = "http://3.110.155.162:3000";

  function App() {
    const [view, setView] = React.useState("dashboard");
    const [users, setUsers] = React.useState([]);

    // 🔹 Fetch users from backend on load
    React.useEffect(() => {
      fetchUsers();
    }, []);

    function fetchUsers() {
      fetch(`${API_URL}/users`)
        .then(res => res.json())
        .then(data => setUsers(data))
        .catch(err => console.error("Error fetching users:", err));
    }

    // 🔹 Add user → backend → SQLite
    function addUser(e) {
      e.preventDefault();
      const f = e.target;

      const newUser = {
        username: f.username.value,
        email: f.email.value,
        role: f.role.value
      };

      fetch(`${API_URL}/users`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(newUser)
      })
        .then(res => res.json())
        .then(() => {
          fetchUsers(); // refresh list
          f.reset();
        })
        .catch(err => console.error("Error adding user:", err));
    }

    return (
      <>
        <header>
          <h2 className="app-title">Frontend Management App</h2>
          <span className="app-subtitle">
            Developed by Ghanshyam | DevOps & Cloud Engineer
          </span>

          <nav>
            <button onClick={() => setView("dashboard")}>Dashboard</button>
            <button onClick={() => setView("users")}>Users</button>
            <button onClick={() => setView("settings")}>Settings</button>
          </nav>
        </header>

        {view === "dashboard" && (
          <div className="card">
            <h3>Dashboard</h3>
            <div className="stats">
              <div className="stat">
                <h2>{users.length}</h2>
                <span>Total Users</span>
              </div>
              <div className="stat"><h2>99.9%</h2><span>Uptime</span></div>
              <div className="stat"><h2>Healthy</h2><span>Services</span></div>
            </div>
          </div>
        )}

        {view === "users" && (
          <div className="card">
            <h3>User Management</h3>

            <form onSubmit={addUser}>
              <input name="username" placeholder="Username" required />
              <input name="email" placeholder="Email" required />
              <select name="role">
                <option value="user">User</option>
                <option value="admin">Admin</option>
              </select>
              <button type="submit">Add User</button>
            </form>

            <table>
              <thead>
                <tr>
                  <th>User</th>
                  <th>Email</th>
                  <th>Role</th>
                </tr>
              </thead>
              <tbody>
                {users.map(u => (
                  <tr key={u.id}>
                    <td>{u.username}</td>
                    <td>{u.email}</td>
                    <td>
                      <span className={`badge ${u.role}`}>{u.role}</span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}

        {view === "settings" && (
          <div className="card">
            <h3>Settings</h3>
            <ul>
              <li>🔐 Authentication: JWT</li>
              <li>🌍 Environment: Production</li>
              <li>🐳 Deployment: Docker Swarm</li>
              <li>📊 Logging: INFO</li>
            </ul>
          </div>
        )}

        <footer>
          © 2025 Ghanshyama | Built for CI/CD, Docker Swarm & Cloud Deployments
        </footer>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
